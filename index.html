<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O O O O | 自己紹介</title>
  <meta name="description" content="O O O Oの自己紹介ページです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- プロフィールセクション -->
  <main class="profile">
    <div class="profile__avatar" aria-hidden="true">森</div>
    <h1 class="profile__name">モリカワタケシ</h1>
    <p class="profile__title">Web デザイナー / エンジニア</p>
    <p class="profile__bio">
      はじめまして。Web制作を学びながら、シンプルで使いやすいデザインを心がけて活動しています。
      新しい技術に触れることが好きで、日々学びを深めています。
    </p>

    <!-- スキル・興味セクション -->
    <section class="skills">
      <h2 class="skills__heading">スキル・興味</h2>
      <ul class="skills__list">
        <li class="skills__item">HTML / CSS</li>
        <li class="skills__item">JavaScript</li>
        <li class="skills__item">UI / UX デザイン</li>
        <li class="skills__item">写真撮影</li>
      </ul>
    </section>

    <!-- 連絡先セクション -->
    <section class="contact">
      <h2 class="contact__heading">連絡先</h2>
      <ul class="contact__list">
        <li class="contact__item">
          <a class="contact__link" href="mailto:example@example.com">example@example.com</a>
        </li>
        <li class="contact__item">
          <a class="contact__link" href="https://x.com/example" target="_blank" rel="noopener noreferrer">X (Twitter)</a>
        </li>
        <li class="contact__item">
          <a class="contact__link" href="https://github.com/example" target="_blank" rel="noopener noreferrer">GitHub</a>
        </li>
      </ul>
    </section>
  </main>

  <!-- フッター -->
  <footer class="footer">
    <p class="footer__text">&copy; 2026 O O O O</p>
  </footer>

</body>

</html>
